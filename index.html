
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Dz</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #170d2b;
      color: white;
    }

    header {
      padding: 25px;
      text-align: center;
      background: linear-gradient(135deg, #54258d, #21113d);
      border-bottom: 2px solid #d7ae55;
    }

    header h1 {
      color: #f4ce72;
      margin: 0;
      font-size: 30px;
    }

    header p { color: #ddd0f4; }

    .wallet {
      margin: 18px;
      padding: 18px;
      text-align: center;
      background: #30204b;
      border: 1px solid #d7ae55;
      border-radius: 14px;
      line-height: 2;
    }

    h2 {
      color: #f4ce72;
      padding: 0 18px;
    }

    .rooms {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 16px;
    }

    .room {
      background: #30204b;
      border: 1px solid #694a91;
      border-radius: 15px;
      padding: 18px 10px;
      text-align: center;
    }

    .room h3 { color: #f4ce72; }

    .room button {
      background: #d5ad55;
      color: #21113d;
      border: 0;
      border-radius: 20px;
      padding: 10px 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .room button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin: 15px;
      padding: 12px;
      text-align: center;
      color: #f4ce72;
    }

    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 15px 5px;
      background: #24143b;
      border-top: 1px solid #d7ae55;
    }

    nav span { color: #f4ce72; }

    main { padding-bottom: 75px; }

    @media (max-width: 360px) {
      .rooms { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <h1>💜 Party Dz</h1>
    <p>عالمك للصداقة والغرف الصوتية</p>
  </header>

  <main>
    <div class="wallet">
      🪙 رصيد العملات: 0
      <br>
      ⭐ مستوى VIP: 0
    </div>

    <h2>🎙️ الغرف الصوتية</h2>

    <div class="rooms">
      <div class="room">
        <h3>غرفة الأصدقاء</h3>
        <p>🎤 8 مقاعد</p>
        <button onclick="joinRoom('friends', this)">دخول</button>
      </div>

      <div class="room">
        <h3>غرفة السهر</h3>
        <p>🎤 8 مقاعد</p>
        <button onclick="joinRoom('night', this)">دخول</button>
      </div>

      <div class="room">
        <h3>غرفة التعارف</h3>
        <p>🎤 8 مقاعد</p>
        <button onclick="joinRoom('meeting', this)">دخول</button>
      </div>

      <div class="room">
        <h3>غرفة خاصة 🔒</h3>
        <p>🎤 8 مقاعد</p>
        <button onclick="joinRoom('private', this)">دخول</button>
      </div>
    </div>

    <div id="message">أهلاً بك في Party Dz 💜</div>
  </main>

  <nav>
    <span>🏠 الرئيسية</span>
    <span>🎁 الهدايا</span>
    <span>👤 حسابي</span>
    <span>⚙️ الإعدادات</span>
  </nav>

  <script>
    const SERVER_URL = "https://party-dz.onrender.com";

    async function joinRoom(roomName, button) {
      const participantName = prompt("اكتب اسمك داخل الغرفة");

      if (!participantName || !participantName.trim()) return;

      const message = document.getElementById("message");

      button.disabled = true;
      message.textContent = "جارٍ الاتصال بالخادم...";

      try {
        const response = await fetch(`${SERVER_URL}/get-token`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            roomName: roomName,
            participantName: participantName.trim()
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "تعذر إنشاء رمز الدخول");
        }

        message.textContent =
          "تم إصدار رمز دخول الغرفة بنجاح. تشغيل الصوت لم يُفعّل بعد.";

        console.log("Room:", roomName);
        console.log("Token received successfully.");

      } catch (error) {
        message.textContent = "خطأ في الاتصال: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
